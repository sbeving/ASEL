services:
  web:
    networks:
      default:
        aliases:
          - client

  caddy:
    profiles:
      - direct-caddy

  dev-tunnel-named:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
